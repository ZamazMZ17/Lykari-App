<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-content: al abrir el teclado se encoge el
      viewport de layout, no solo el visual. Sin esto las hojas quedan ancladas
      al fondo de la pantalla, debajo del teclado, y no se ve ni el botón de
      guardar ni lo que se está escribiendo.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#DCE0D9" />
    <meta name="description" content="Registro de lo que de verdad hiciste." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lykari" />
    <link rel="apple-touch-icon" href="/icono-180.png" />
    <title>Lykari</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
