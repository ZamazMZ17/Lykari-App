name: Publicar APK

# Se dispara al empujar un tag "v1.2.3", o a mano desde la pestaña Actions
# de GitHub (botón "Run workflow") sin necesitar git ni la terminal. La
# pantalla de Ajustes compara la versión instalada contra el último release
# publicado aquí, así que sin esto el chequeo de actualización no tiene
# nada real a qué apuntar.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej. 0.1.0). Vacío = la del package.json."
        required: false

permissions:
  contents: write

jobs:
  build-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # @capacitor/cli 8.x exige Node >=22.
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # capacitor.build.gradle generado exige sourceCompatibility 21.
          java-version: "21"

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renombrar el APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Lykari.apk

      # Incluso si la creación del release tuviera un problema externo, el APK
      # queda disponible para descargar desde esta ejecución de Actions.
      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Lykari-${{ github.ref_name }}
          path: Lykari.apk
          if-no-files-found: error
          retention-days: 30

      - name: Calcular el tag del release
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "nombre=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version="${{ inputs.version }}"
            if [ -z "$version" ]; then version=$(node -p "require('./package.json').version"); fi
            echo "nombre=v$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.nombre }}" Lykari.apk \
            --target "${{ github.sha }}" \
            --title "LyKari ${{ steps.tag.outputs.nombre }}" \
            --generate-notes
