name: Publicar APK

# Se dispara al empujar un tag "v1.2.3". La pantalla de Ajustes compara la
# versión instalada contra el último release publicado aquí, así que sin
# esto el chequeo de actualización no tiene nada real a qué apuntar.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Renombrar el APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Lykari.apk

      - name: Publicar el release
        uses: softprops/action-gh-release@v2
        with:
          files: Lykari.apk
          generate_release_notes: true
